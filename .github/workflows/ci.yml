name: CRM quality and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "$changed"
          if grep -Eq '^(src/|tests/|scripts/|supabase/|\.github/|package\.json$|pnpm-lock\.yaml$|next\.config\.ts$|tsconfig\.json$|eslint\.config\.mjs$|vitest\.config\.ts$|playwright\.config\.ts$)' <<< "$changed"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit
      - name: Start disposable Supabase and apply migrations
        run: pnpm exec supabase start -x studio,postgres-meta,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - run: pnpm db:test
      - run: pnpm seed:local
      - run: pnpm test:security
      - run: pnpm test:concurrency
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      - name: Pack standalone runtime with pnpm symlinks preserved
        if: matrix.node == 22
        run: tar -czf next-runtime.tar.gz -C .next/standalone .
      - name: Save Node 22 runtime for smoke test
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: next-runtime
          path: next-runtime.tar.gz
          retention-days: 1

  health:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-runtime
      - run: mkdir -p .next/standalone && tar -xzf next-runtime.tar.gz -C .next/standalone
      - run: pnpm exec supabase start -x studio,postgres-meta,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - run: node scripts/health-smoke.mjs
