name: mini-crm
services:
  app:
    image: ${CRM_IMAGE}
    container_name: crm-app
    restart: unless-stopped
    env_file: .env.production
    networks:
      - site
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/crm/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
networks:
  site:
    external: true
    name: nmol_default
